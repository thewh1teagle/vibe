[package]
name = "vibe"
version = "0.0.6"
description = "Vibe"
authors = ["@thewh1teagle"]
license = "MIT"
repository = "https://github.com/thewh1teagle/vibe"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools", "macos-private-api", "tray-icon"] }
meeting-detect = { path = "../../crates/meeting-detect" }

# Plugins
tauri-plugin-window-state = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-os = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-store = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-aptabase = { git = "https://github.com/vibe-transcribe/tauri-plugin-aptabase", branch = "deterministic-daily-session" }
# Unsafe headers required for Ollama (to set Origin)
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"

# Keep-awake, used directly rather than via tauri-plugin-keepawake (which only wraps it).
keepawake = "0.6.1"

serde_json = { workspace = true }
eyre = { workspace = true }

tokio = { version = "1.49.0", features = ["net", "fs", "macros", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
bytes = "1"
# Verify downloaded models against the catalog hash
sha2 = "0.10"
once_cell = "1.21.3"
serde = { version = "^1.0.228", features = ["derive"] }
url = "2.5.8"
showfile = "0.1.1"
futures = "0.3.31"
futures-util = "0.3"
cpal = { git = "https://github.com/thewh1teagle/cpal", branch = "feat/macos-system-audio-permission-check" }
hound = "3.5.1"
rand = "0.9.2"
# Anonymous, locally generated analytics install id
uuid = { version = "1", features = ["v4"] }

# HTTP client for server communication and downloads
reqwest = { version = "0.13", features = ["multipart", "stream", "json"] }

# Log
tracing = { version = "0.1.44", features = ["log"] }
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
glob = "0.3.3"
# Watch app_config.json for edits made outside the app
notify = "8"

chrono = "0.4.43"
crash-handler = "0.7.0"
urlencoding = "2.1.3"
bytemuck = "1.24.0"
which = "8"
enigo = "0.3"

# Phone handoff (iroh p2p)
iroh = "1"
subtle = "2"
hex = "0.4"

# Linux
[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10.75", features = ["vendored"] }

# Windows
[target.'cfg(windows)'.dependencies]
winreg = "0.55.0"
# Used to attach to console
windows = { version = "0.62.2", features = [
	"Win32_System_Console",
	"Win32_Foundation",
] }
# Used to redirect stdout/stderr from c++ to the attached console
libc = "0.2.180"
libc-stdhandle = "=0.1.0"

# macOS
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSWindow", "NSOpenPanel", "NSSavePanel", "NSPanel"] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSString", "NSURL"] }
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel.git", rev = "c9ec2130422200f0863b23dfdad02b133a529b07" }
block2 = "0.6.2"
window-vibrancy = "0.6"

[features]
default = []
