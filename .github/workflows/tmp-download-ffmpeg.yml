name: Temp Download FFmpeg

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xtask-package:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Package dummy binary with xtask
        run: |
          set -euxo pipefail
          printf '#!/bin/sh\nexit 0\n' > dummy-sona
          chmod +x dummy-sona
          cargo xtask package-release \
            --binary dummy-sona \
            --goos darwin \
            --goarch amd64 \
            --out dummy-with-ffmpeg.tar.gz
          tar -tzf dummy-with-ffmpeg.tar.gz
