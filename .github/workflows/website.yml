name: Deploy Website

on:
    push:
        branches:
            - main
        paths:
            - "website/**"
            - "i18n/**"
            - "scripts/website_links.py"
            - "pwa/**"
            - "handoff-wasm/**"
    release:
        types: [published]
    workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
    contents: read
    pages: write
    id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    build:
        runs-on: macos-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  package_json_file: website/package.json

            - name: setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: website/pnpm-lock.yaml

            - name: setup uv
              uses: astral-sh/setup-uv@v5

            - name: Build
              run: |
                pnpm install
                uv run ../scripts/website_links.py
                cp -rf ../docs public/
                pnpm build
              working-directory: website
              env:
                GH_TOKEN: ${{ github.token }}

            # The phone PWA ships inside the same Pages artifact, at /vibe/phone/.
            # Its iroh client is Rust compiled to wasm, so it needs a toolchain.
            - name: setup Rust for the wasm client
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown

            - name: cache Rust build
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: handoff-wasm

            - name: install wasm-bindgen-cli
              uses: taiki-e/install-action@v2
              with:
                  # Must match the pinned `wasm-bindgen` dependency in handoff-wasm/Cargo.toml
                  # exactly, or the CLI refuses to process the module.
                  tool: wasm-bindgen-cli@0.2.122

            - name: install binaryen
              run: brew install binaryen

            - name: Build phone PWA
              run: |
                ./handoff-wasm/build.sh
                pnpm --dir pwa install
                pnpm --dir pwa build
                mkdir -p website/dist/phone
                cp -R pwa/dist/. website/dist/phone/
              env:
                PWA_BASE: /vibe/phone/

            - name: Setup Pages
              uses: actions/configure-pages@v6

            - name: Upload Artifacts
              uses: actions/upload-pages-artifact@v5
              with:
                  path: website/dist

    deploy:
        needs: build
        runs-on: macos-latest

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Deploy
              id: deployment
              uses: actions/deploy-pages@v5
