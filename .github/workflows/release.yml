name: Release Sona

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version/tag (for example: v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}

jobs:
  create-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Sona ${{ env.VERSION }}
          generate_release_notes: true

  build-and-upload:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            binary: sona-linux-amd64
          - runner: ubuntu-24.04-arm
            binary: sona-linux-arm64
          - runner: macos-14
            binary: sona-darwin-arm64
            package_os: darwin
            package_arch: arm64
            archive: sona-darwin-arm64-with-ffmpeg.tar.gz
          - runner: macos-15-intel
            binary: sona-darwin-amd64
            package_os: darwin
            package_arch: amd64
            archive: sona-darwin-amd64-with-ffmpeg.tar.gz
          - runner: windows-latest
            binary: sona-windows-amd64.exe
            package_os: windows
            package_arch: amd64
            archive: sona-windows-amd64-with-ffmpeg.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Vulkan deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libvulkan-dev
      - name: Install Vulkan deps (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-vulkan-devel mingw-w64-x86_64-gcc
      - name: Add MinGW to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "$env:RUNNER_TEMP\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Download prebuilt whisper.cpp libs
        run: cargo xtask fetch-libs
      - name: Build sona
        shell: bash
        env:
          SONA_VERSION: ${{ env.VERSION }}
          SONA_COMMIT: ${{ github.sha }}
        run: |
          cargo build -p sona --release
          src="target/release/sona"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            src="${src}.exe"
          fi
          cp "$src" "${{ matrix.binary }}"
      - name: Package release bundle with ffmpeg
        if: matrix.archive != ''
        shell: bash
        run: |
          cargo xtask package-release \
            --binary "${{ matrix.binary }}" \
            --goos "${{ matrix.package_os }}" \
            --goarch "${{ matrix.package_arch }}" \
            --out "${{ matrix.archive }}"
      - name: Print Windows runtime DLL dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\msys64\mingw64\bin\objdump.exe" -p "${{ matrix.binary }}" | Select-String "DLL Name"
      - name: Upload packaged archive to release
        if: matrix.archive != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:VERSION" "${{ matrix.archive }}" --clobber
      - name: Upload raw binary to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:VERSION" "${{ matrix.binary }}" --clobber
