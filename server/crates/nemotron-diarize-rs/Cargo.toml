[package]
name = "nemotron-diarize-rs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Speaker diarization library for vibe-server using NVIDIA Nemotron-3-Diarization"

[lib]
name = "nemotron_diarize_rs"
path = "src/lib.rs"

[dependencies]
ggml-rs-sys = { path = "../ggml-rs-sys" }
hound = "3.5"
rayon = "1.11"
rustfft = "6.4"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
