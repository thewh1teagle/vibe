[package]
name = "whisper-rs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure-Rust whisper engine on the GGML runtime"

[dependencies]
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
thiserror = "2"
tracing = "0.1"
ggml-rs-sys = { path = "../ggml-rs-sys", optional = true }
vad-rs = { path = "../vad-rs", optional = true }

[dev-dependencies]
hound = "3.5"
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = ["ffi"]
# Historical name: enables the native GGML engine. Without it the crate
# builds as pure Rust with a stub Context.
ffi = ["dep:ggml-rs-sys", "dep:vad-rs"]
