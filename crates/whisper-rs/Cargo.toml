[package]
name = "whisper-rs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust wrapper for Sona's prebuilt whisper.cpp libraries"

[lib]
name = "whisper_rs"
path = "src/lib.rs"

[dependencies]
hound = { version = "3.5", optional = true }
libc = "0.2"
thiserror = "2.0"
whisper-cpp-sys = { path = "../whisper-cpp-sys", optional = true }
vad-rs = { path = "../vad-rs", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
] }

[features]
default = []
ffi = ["dep:whisper-cpp-sys", "dep:vad-rs"]

[[example]]
name = "transcribe"
required-features = ["ffi", "hound"]
