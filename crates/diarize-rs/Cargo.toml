[package]
name = "diarize-rs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Speaker diarization library for Sona using NVIDIA Sortformer"

[lib]
name = "diarize_rs"
path = "src/lib.rs"

[dependencies]
# The ggml/GGUF backend. Replaces ONNX Runtime.
whisper-cpp-sys = { path = "../whisper-cpp-sys" }
# Host-side DSP and state machine (`src/host/`), vendored from parakeet-rs.
# Same versions the upstream crate used, so the arithmetic is unchanged.
ndarray = "0.17"
realfft = "3"
serde = { version = "1", features = ["derive"] }
thiserror = "2"


[dev-dependencies]
hound = "3.5"
